name: Ночная проверка сайтов

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: monitoring-history
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.save.outputs.revision }}
    steps:
      - name: Получить код
        uses: actions/checkout@v7
      - name: Установить Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Проверить сайты
        run: node scripts/check.mjs
      - name: Сохранить результаты в репозиторий
        id: save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/results.json
          git commit -m "monitoring: результаты ночной проверки"
          git pull --rebase origin main
          git push
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  notify:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.revision }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Сообщить об изменениях
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/check.mjs --notify

  publish:
    needs: check
    uses: ./.github/workflows/deploy.yml
